name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply patches to their base and run the checks
        run: ./t3code-customize verify
      - name: Show the log on failure
        if: failure()
        run: tail -n 200 ~/.cache/t3code-customize/logs/*.log
  windows-installer-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python -m unittest discover -s tests -p test_windows.py -v
      - run: ./t3code-customize.ps1 install --help
