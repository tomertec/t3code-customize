name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Installed T3 commit for an optional Windows bundle build
        required: false
      appVersion:
        description: Installed Nightly version
        required: false
      publicConfig:
        description: Public Connect config JSON
        required: false
        default: '{}'

jobs:
  windows-bundles:
    if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
    uses: ./.github/workflows/windows-bundles.yml
    permissions:
      contents: read
    with:
      commit: ${{ inputs.commit }}
      appVersion: ${{ inputs.appVersion }}
      publicConfig: ${{ inputs.publicConfig }}
  installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply patches to their base and run the checks
        run: ./t3code-customize verify
      - name: Show the log on failure
        if: failure()
        run: tail -n 200 ~/.cache/t3code-customize/logs/*.log
  windows-installer-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python -m unittest discover -s tests -p test_windows.py -v
      - run: ./t3code-customize.ps1 install --help
